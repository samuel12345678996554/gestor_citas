{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Formulario de Cita</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'citas:lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
