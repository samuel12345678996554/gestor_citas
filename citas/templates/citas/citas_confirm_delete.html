{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Eliminar Cita</h2>

    <p>¿Estás seguro de que deseas eliminar esta cita?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'citas:lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
