{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Formulario de Paciente</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'pacientes:lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<div class="card">
  <h2>{{ isEdit ? 'Editar Especialidad' : 'Crear Especialidad' }}</h2>
  <form #form="ngForm" (ngSubmit)="save(form)">
    <div class="field">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" pInputText [(ngModel)]="especialidad.nombre" name="nombre" required />
    </div>

    <button pButton type="submit" label="{{ isEdit ? 'Actualizar' : 'Crear' }}" class="p-mt-2"></button>
  </form>
</div>

{% endblock %}
