<div class="card p-4">

    <div class="flex justify-between items-center mb-3">
        <h2 class="text-xl font-semibold">Listado de Pacientes</h2>

        <!-- ✔ Botón Crear Paciente -->
        <p-button
            label="Nuevo Paciente"
            icon="pi pi-plus"
            styleClass="p-button-success"
            [routerLink]="['/pacientes/new']">
        </p-button>
    </div>

    <p-table
        [value]="pacientes"
        [loading]="loading"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[5,10,20]"
        responsiveLayout="scroll">

        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Cédula</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-paciente>
            <tr>
                <td>{{ paciente.id }}</td>
                <td>{{ paciente.nombre }}</td>
                <td>{{ paciente.apellido }}</td>
                <td>{{ paciente.cedula }}</td>
                <td>{{ paciente.telefono }}</td>
                <td>{{ paciente.email }}</td>

                <td class="text-center">
                    <div class="flex justify-center gap-2">

                        <p-button icon="pi pi-eye"
                            styleClass="p-button-rounded p-button-text p-button-info"
                            [routerLink]="['/pacientes/view', paciente.id]"
                            pTooltip="Ver detalles">
                        </p-button>

                        <p-button icon="pi pi-pencil"
                            styleClass="p-button-rounded p-button-text p-button-warning"
                            [routerLink]="['/pacientes/edit', paciente.id]"
                            pTooltip="Editar">
                        </p-button>

                        <p-button icon="pi pi-trash"
                            styleClass="p-button-rounded p-button-text p-button-danger"
                            (onClick)="confirmDelete(paciente)"
                            pTooltip="Eliminar">
                        </p-button>

                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="text-center p-4">
                    <div class="flex flex-col items-center gap-3">
                        <i class="pi pi-info-circle text-4xl text-gray-400"></i>
                        <span class="text-gray-500">No se encontraron pacientes</span>

                        <p-button
                            label="Crear Primer Paciente"
                            icon="pi pi-plus"
                            [routerLink]="['/pacientes/new']"
                            styleClass="p-button-sm p-button-outlined">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>

    </p-table>

</div>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
