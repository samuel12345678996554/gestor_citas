<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<!-- Botón Crear -->
<button pButton type="button" label="Nuevo Médico" class="p-mb-2 p-button-success"
        routerLink="/medicos/new"></button>

<p-table [value]="medicos" [loading]="loading" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5,10,20]" [responsiveLayout]="'scroll'">
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Especialidad</th>
      <th>Teléfono</th>
      <th>Email</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-medico>
    <tr>
      <td>{{ medico.nombre }}</td>
      <td>{{ medico.apellido }}</td>
      <td>{{ medico.especialidadNombre }}</td>
      <td>{{ medico.telefono }}</td>
      <td>{{ medico.email }}</td>
      <td>
        <button pButton type="button" icon="pi pi-pencil" class="p-button-warning p-button-sm"
                pTooltip="Editar médico" tooltipPosition="top"
                [routerLink]="['/medicos/edit', medico.id]"></button>

        <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm"
                pTooltip="Eliminar médico" tooltipPosition="top"
                (click)="confirmDelete(medico)">
        </button>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="6" class="text-center">No hay médicos disponibles.</td>
    </tr>
  </ng-template>
</p-table>
